[project]
name = "pioneer-dj-corrector"
version = "2.0.0"
description = "Fix Pioneer DJ E-8305 WAV compatibility and convert audio for rekordbox USB drives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
    "PyQt5>=5.15.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py39"]
